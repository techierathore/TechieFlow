# TechieFlow model routing — DECLARATION ONLY (docs/Adapter-Design.md §5.2;
# decision: DECISIONS.md 2026-08-19 §2).
#
# enabled: false  ⇒  nothing changes anywhere. Phases keep running on whatever
# model the session runs on, exactly as before this file existed.
#
# A phase declares a TIER, never a model. The tiers map resolves a tier to a
# per-harness model id (Claude Code aliases: opus|sonnet|haiku|inherit|<id>,
# pinnable via ANTHROPIC_DEFAULT_*_MODEL; OpenCode ids: provider/model, list
# with `opencode models`).
# Routing is declared at the harness boundary and
# OBSERVED by telemetry (runs.jsonl model/tier fields) — it is never enforced
# mid-turn, because neither harness can switch a running turn's model.
#
# Read this file with:  bash .tfcore/utils/tf-harness.sh tier <phase>
#                       bash .tfcore/utils/tf-harness.sh model <tier>
#                       bash .tfcore/utils/tf-harness.sh effort <tier>
# Parsing contract: two-space indent, one "key: value" per line — keep it flat.
#
# When flipped to enabled: true, the harness bindings still have to be emitted
# (Claude: .claude/commands/tf/<phase>.md wrappers + .claude/agents/tf-*.md;
# OpenCode: model fields in .opencode/opencode.jsonc) — see Adapter-Design
# §5.3/§5.4 and the rollout order in §6. Flipping the flag alone changes
# nothing; that is deliberate.

# Owner decisions: 2026-09-05, Sonnet for every long-running Claude phase, Haiku for the cheap ones;
# 2026-09-06, the OpenAI models for OpenCode (gpt-5.6-terra for frontier and standard, gpt-5.6-luna
# for economy) after the OpenCode Go monthly limit was reached with MiMo.
#
# HOW TO CHANGE A MODEL (the plain version; the full guide is docs/TechieFlow-Routing-Guide.md):
#   1. This file is the FRAMEWORK DEFAULT. A project gets a copy at .tfcore/routing.yaml when it is
#      scaffolded, and update-framework.sh never overwrites that copy. So to change one project,
#      edit the project's copy; to change every future project, edit this one.
#   2. Edit the model id under `tiers:` for the harness you use (claude: opus|sonnet|haiku or a
#      full id; opencode: provider/model as printed by `opencode models`).
#   3. In the project folder run: bash .tfcore/utils/tf-routing-bind.sh
#      That regenerates the harness bindings (.claude/agents/*.md, .claude/commands/tf/*.md,
#      .opencode/opencode.json). Nothing changes until it runs.
#   4. For one unattended run only, pass --model <id> to tf-goal.sh instead; the main agent uses
#      it, the sub-agents still use the bindings from step 3.
#   5. When a model's usage limit is reached, the tier's `fallbacks:` list is the answer — see the
#      block below. Nothing is automatic until a limit is actually hit.
enabled: true
# ---------------------------------------------------------------------------
# Tier → model id, per harness. STARTING VALUES — the owner tunes these.
# OpenCode ids are provider/model as printed by `opencode models` on this machine.
# ---------------------------------------------------------------------------
tiers:
  frontier:
    claude: sonnet
    opencode: openai/gpt-5.6-terra
  standard:
    claude: sonnet
    opencode: openai/gpt-5.6-terra
  economy:
    claude: haiku
    opencode: openai/gpt-5.6-luna

# ---------------------------------------------------------------------------
# Tier → the models to try INSTEAD, in order, while the tier model is limited.
# Comma-separated, one line per harness, same flat two-space shape as `tiers:`.
#
# WHAT USES IT. `bash .tfcore/utils/tf-model-pick.sh pick <tier> <harness>` returns the first
# model in "tier model, then this list" that is NOT on cooldown. tf-goal.sh puts a model on
# cooldown when a cycle ends in a usage limit, re-binds, and starts the next cycle on the next
# model; tf-routing-bind.sh reads the same answer, so the sub-agents move with the main agent
# instead of failing behind it. A cooldown expires by itself at the reset time the limit message
# stated, and the tier goes back to its own model.
#
# WHEN IT DOES NOT HELP, stated plainly: on Claude Code the 5-hour and weekly limits are the
# ACCOUNT's, not the model's, so a fallback to another Claude model is limited too. The supervisor
# finds that out the honest way — the next cycle hits the same limit, that model goes on cooldown
# as well, and once the chain is exhausted it sleeps until the reset exactly as it did before.
# A per-model limit (Opus exhausted while the account is fine) is where the Claude column earns
# its keep; a provider outage or a monthly balance is where the OpenCode column does.
#
# Empty list = no fallback for that tier; the supervisor sleeps. That is the safe default for
# anyone who does not want a phase silently running on a different model.
#
# WHERE THE "limited until <time>" RECORD IS KEPT. In this project, at
# .tfcore/.session/model-cooldown.json — the framework is installed per project, so its state is
# per project too, and one project's setting never reaches another. Uncomment the line below to
# move it: a path relative to the project root, or an absolute one. Several projects pointed at
# one file learn about a limit from each other instead of each finding it out for themselves.
# cooldown_file: .tfcore/.session/model-cooldown.json
# ---------------------------------------------------------------------------
# The OpenCode lines below are OpenCode Go models (https://opencode.ai/docs/go — a $10/month plan
# with a per-model monthly allowance, which is exactly the limit these chains exist for). Each tier
# falls back to a DIFFERENT model, because the allowance that ran out is per model, and then to a
# different provider, because a whole plan can run out at once.
fallbacks:
  frontier:
    claude: opus, haiku
    opencode: opencode-go/glm-5.3, opencode-go/kimi-k3, openai/gpt-5.6-sol
  standard:
    claude: haiku
    opencode: opencode-go/mimo-v2.5, opencode-go/qwen3.8-max, openai/gpt-5.6-luna
  economy:
    claude: sonnet
    opencode: opencode-go/deepseek-v4-flash, opencode-go/glm-5.3-flash, openai/gpt-5.6-luna

# ---------------------------------------------------------------------------
# How each harness is PAID FOR. This is what stops one `cost_usd` column pooling
# three different kinds of number (SCHEMA.md §2.5b).
#   subscription  a flat fee buys a quota. Marginal dollars are zero; the unit that means
#                 anything is tokens. Claude Max, and any OpenCode provider signed in with OAuth.
#   metered       an API key billed per token. The dollars are real money and are summed.
#   local         a model on this machine. No quota, no bill.
#   auto          work it out per model — OpenCode's own auth.json says oauth or api, and a
#                 provider it has never heard of that answers locally is local.
# `auto` is right for OpenCode because one machine mixes all three at once. Claude Code is
# declared, because nothing in a transcript says which plan paid for it.
# ---------------------------------------------------------------------------
billing:
  claude: subscription
  opencode: auto

# ---------------------------------------------------------------------------
# Phase → tier. One line each; values: frontier | standard | economy | inherit.
# Rationale per row: docs/Adapter-Design.md §5.6 (the tier map is a HYPOTHESIS
# with a measurement attached — rework ratio by tier from runs.jsonl decides).
# ---------------------------------------------------------------------------
phases:
  day1-greenfield: frontier
  day1-brownfield: frontier
  amend-docs: frontier
  mockups: standard
  split-brd: standard
  build-phase: standard
  fix-issues: frontier
  triage-and-fix: frontier
  triage-issues: standard
  log-miss: economy
  verify-phase: standard
  devguide: standard
  productguide: economy
  handoff-phase: economy
  refresh-status: economy
  render-workflow-docs: economy
  generate-html: economy
  metrics-report: economy

# ---------------------------------------------------------------------------
# Subagent → tier (builders are where the tokens go — Adapter-Design §5.6).
# ---------------------------------------------------------------------------
subagents:
  tf-builder: standard
  trblazeui: standard
  techierag: standard
  tf-test-writer: standard
  tf-explorer: economy

# ---------------------------------------------------------------------------
# Tier → reasoning effort (used by Claude Code; ignored by OpenCode).
# ---------------------------------------------------------------------------
effort:
  frontier: high
  standard: medium
  economy: low

# ---------------------------------------------------------------------------
# Escalation — ADVISORY ONLY (ported from AI-First-Playbook model-tiers.yml;
# decision: DECISIONS.md 2026-08-21). Meaning of the row below: when the SAME
# REQs have already been through `fix-issues` after_attempts times without
# reaching Verified, launch the NEXT run on `tier`. It is applied by whoever
# launches the phase (you, or a wrapper script) by reading the attempt history —
# `attempt` on runs.jsonl records / the checklist verdict history — BEFORE the
# run starts. Nothing switches a running phase's model; neither harness can.
# Read the next attempt number with:
#   bash .tfcore/utils/tf-emit.sh --next-run-attempt fix-issues REQ-UI-009 ...
# Format: <phase>: (one line)  then  "    after_attempts: <int>"  "    tier: <tier>".
# Ignored entirely while enabled: false, like everything else in this file.
# ---------------------------------------------------------------------------
escalation:
  fix-issues:
    after_attempts: 2
    tier: frontier
