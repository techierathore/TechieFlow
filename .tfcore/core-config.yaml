markdownExploder: true
# NOTE (custom solo-dev flow): the qa/prd/devStory keys below are stock TechieFlow v4 values kept
# only for the unused stock agents (qa, sm, po, dev story flow). The custom workflow uses
# docs/{AppName}-BRD.md / docs/{AppName}-Architecture.md (set in customTechnicalDocuments by
# the day-1 tasks) and bans dated docs/qa result files — per-REQ status lives in each
# checklist's Requirements Status table.
qa:
  qaLocation: docs/qa
prd:
  prdFile: docs/prd.md
  prdVersion: v4
  prdSharded: false
  prdShardedLocation: docs/prd
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: docs/architecture.md
  architectureVersion: v4
  architectureSharded: false
  architectureShardedLocation: docs/architecture
customTechnicalDocuments: null
# appSize / appKind: set by the day-1 tasks (reset Session 3, 2026-09-04). Size is Small (up to 10
# screens, one role, 50 requirements), Medium (up to 20 screens, 100 requirements) or Large (split
# into phases). Kind is app or library. tf-doc-check.sh reads them when a document header lacks them.
appSize: null
appKind: null
# devLoadAlwaysFiles: the day-1 tasks rewrite this list with the project's concrete paths
# (docs/{AppName}-Coding-Standards.md + docs/{AppName}-Architecture.md). Empty until then —
# the stock paths (docs/architecture/coding-standards.md etc.) never exist in this flow.
devLoadAlwaysFiles: []
devDebugLog: .ai/debug-log.md
devStoryLocation: docs/stories
slashPrefix: TechieFlow
# artifactRetentionDays: 7   # sweep-artifacts.sh (SessionStart) deletes run material under
#                            # tests/.artifacts/ and .verify/ older than this; 0 disables the age sweep
# runtimeVerification: per-app, OPT-IN. Only set the heads this app actually ships.
# The verifier/devguide/smoke gates drive Blazor with headless Playwright and the MAUI
# Windows head with FlaUI/Appium-Win (unchanged). For MAUI Android / iOS / Mac Catalyst
# they drive the RUNNING UI via an Appium WebDriver endpoint and feed the SAME screenshots +
# element tree into the data-render (§4a) and visual-truth (§4b) gates. The WSL side only needs
# the HTTP url — no adb/emulator/Xcode in WSL. An absent/unreachable endpoint degrades that head
# to `⚠ STATIC-ONLY` (never a faked pass). One-time host setup: WORKFLOW.html §0b.
# runtimeVerification:
#   appium:
#     android:
#       url: http://localhost:4723        # Win11 mirrored networking ON → localhost reaches the Windows-host Appium
#       avd: Pixel_API_34                 # the AVD to boot
#       launch: winrun "powershell -File start-android-verify.ps1"   # how the verifier boots emulator + Appium itself
#     ios:
#       url: http://192.168.1.50:4723     # the LAN Mac (stable IP via DHCP reservation); Appium bound to 0.0.0.0
#       simulator: "iPhone 15"
#     maccatalyst:
#       url: http://192.168.1.50:4723     # same Mac, mac2 driver
