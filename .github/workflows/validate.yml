# Runs on every push and every pull request.
# Two commands, the same two that `npm publish` runs before it uploads anything:
#   npm run validate       mirror parity, OpenCode references, bash -n on every script, shell
#                          portability (tests/portability/run.sh), npm pack --dry-run
#   npm run test:install   the installer against the three shell scripts in a temporary folder
# The second job runs them on a stock Mac: Apple's bash 3.2 at /bin/bash and the BSD tools,
# with Homebrew taken off PATH, plus every tests/*/run.sh under /bin/bash. Both jobs run every
# tests/*/run.sh twice, in UTC and in Asia/Kolkata (UTC+5:30).
name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show the tools the checks depend on
        run: |
          node --version
          npm --version
          bash --version | head -1
          python3 --version
          rsync --version | head -1

      - name: Validate the repository
        run: npm run validate

      - name: Test the installer against the shell scripts
        run: npm run test:install

      # Every suite twice: in UTC, the runner's own zone, and in Asia/Kolkata (UTC+5:30), where
      # an owner's Mac found a case that UTC hides. A script that mixes local and UTC time fails
      # the second run only.
      - name: Every tests/*/run.sh (TZ=UTC)
        if: always()
        env:
          TZ: UTC
        run: |
          failed=""
          for suite in tests/*/run.sh; do
            echo "::group::$suite"
            if bash "$suite"; then echo "PASS $suite"; else echo "FAIL $suite (exit $?)"; failed="$failed $suite"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
          echo "every suite passed"

      - name: Every tests/*/run.sh (TZ=Asia/Kolkata)
        if: always()
        env:
          TZ: Asia/Kolkata
        run: |
          failed=""
          for suite in tests/*/run.sh; do
            echo "::group::$suite"
            if bash "$suite"; then echo "PASS $suite"; else echo "FAIL $suite (exit $?)"; failed="$failed $suite"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
          echo "every suite passed"

  macos-stock:
    name: validate (stock macOS, /bin/bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        # Apple's own bash, never the Homebrew one the runner image also has.
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep only the stock tools on PATH
        # The runner image has Homebrew (GNU coreutils, a newer bash) in /opt/homebrew and
        # /usr/local. A stock Mac has neither, so PATH keeps Node, /bin/bash (linked in first, so a
        # plain `bash` is 3.2) and the system folders only. Nothing is installed with brew.
        run: |
          mkdir -p "$RUNNER_TEMP/stock-bin"
          ln -sf /bin/bash "$RUNNER_TEMP/stock-bin/bash"
          node_dir="$(dirname "$(command -v node)")"
          echo "PATH=$RUNNER_TEMP/stock-bin:$node_dir:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"

      - name: Show the tools the checks depend on
        run: |
          echo "PATH=$PATH"
          bash --version | head -1
          /bin/bash --version | head -1
          node --version
          npm --version
          python3 --version
          perl -e 'print "perl $^V\n"'
          rsync --version 2>&1 | head -1 || true
          for tool in timeout gtimeout setsid realpath mapfile; do
            if command -v "$tool" >/dev/null 2>&1; then echo "$tool: $(command -v "$tool")"; else echo "$tool: not on PATH"; fi
          done
          if sed --version >/dev/null 2>&1; then echo "sed: GNU"; else echo "sed: BSD"; fi
          if date -d @0 >/dev/null 2>&1; then echo "date: GNU"; else echo "date: BSD"; fi

      - name: Validate the repository
        run: npm run validate

      - name: Test the installer against the shell scripts
        if: always()
        run: npm run test:install

      - name: Shell portability check and shim tests
        if: always()
        run: /bin/bash tests/portability/run.sh

      - name: Every tests/*/run.sh under /bin/bash (TZ=UTC)
        if: always()
        env:
          TZ: UTC
        run: |
          failed=""
          for suite in tests/*/run.sh; do
            echo "::group::$suite"
            if /bin/bash "$suite"; then echo "PASS $suite"; else echo "FAIL $suite (exit $?)"; failed="$failed $suite"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
          echo "every suite passed"

      - name: Every tests/*/run.sh under /bin/bash (TZ=Asia/Kolkata)
        if: always()
        env:
          TZ: Asia/Kolkata
        run: |
          failed=""
          for suite in tests/*/run.sh; do
            echo "::group::$suite"
            if /bin/bash "$suite"; then echo "PASS $suite"; else echo "FAIL $suite (exit $?)"; failed="$failed $suite"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi
          echo "every suite passed"

  # Temporary: finds why owner_handoff_a fails on the owner's Mac (macOS 26, Asia/Kolkata as the
  # system zone, TZ unset). Removed once the cause is fixed.
  diagnose-owner-handoff:
    name: diagnose owner_handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only the stock tools on PATH
        run: echo "PATH=/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
      - name: What the machine is
        run: |
          sw_vers; uname -a; ls -l /etc/localtime; date; date -u
          python3 --version
          set +e
          date -d @0 +%s; echo "date -d @0 exit $?"
          date -u -d '-5 min' +%FT%T; echo "date -d '-5 min' exit $?"
          source .tfcore/utils/tf-portable.sh
          for z in UTC Asia/Kolkata; do
            echo "TZ=$z: local -2 min: $(TZ=$z tf_date_from '-2 min' +%Y%m%d%H%M.%S)  utc -5 min: $(TZ=$z tf_date_from -u '-5 min' +%FT%T)  now: $(TZ=$z date '+%F %T %Z')"
          done
      - name: owner_handoff, TZ=UTC
        if: always()
        run: TZ=UTC bash -x tests/regression/run.sh owner_handoff 2>&1 | tail -80
      - name: owner_handoff, TZ=Asia/Kolkata
        if: always()
        run: TZ=Asia/Kolkata bash -x tests/regression/run.sh owner_handoff 2>&1 | tail -80
      - name: owner_handoff, system zone Asia/Kolkata, TZ unset
        if: always()
        run: |
          sudo systemsetup -settimezone Asia/Kolkata >/dev/null 2>&1 || sudo ln -sf /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
          ls -l /etc/localtime; date
          unset TZ
          bash -x tests/regression/run.sh owner_handoff 2>&1 | tail -80
