# One-off: puts the TF-052 follow-up entry into docs/CHANGELOG.md on mac-portability by applying
# docs/Mac-Portability-changelog.patch here, because the 414 KB file does not fit in one GitHub API
# upload from the session that wrote it. Runs only on mac-portability, does nothing once the patch
# file is gone, and is deleted right after it has run.
name: Apply the changelog patch (one-off)

on:
  push:
    branches: [mac-portability]
    paths:
      - docs/Mac-Portability-changelog.patch
      - .github/workflows/apply-changelog-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/mac-portability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out mac-portability
        uses: actions/checkout@v4
        with:
          ref: mac-portability

      - name: Apply the patch, check it, commit, push to mac-portability
        run: |
          set -eu
          if [ ! -f docs/Mac-Portability-changelog.patch ]; then echo "no patch file; nothing to do"; exit 0; fi
          git apply --check docs/Mac-Portability-changelog.patch
          git apply docs/Mac-Portability-changelog.patch
          got="$(git hash-object docs/CHANGELOG.md)"
          echo "docs/CHANGELOG.md blob: $got"
          test "$got" = 6b0db2de7d4c8211d28f2321580f831de733134e
          git rm -q docs/Mac-Portability-changelog.patch
          git add docs/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "CHANGELOG: TF-052 follow-up (log-miss and triage close read the outer command as their own)" -m "Applied from docs/Mac-Portability-changelog.patch, which this commit removes."
          git push origin HEAD:refs/heads/mac-portability
          git log -1 --format='pushed %H'
